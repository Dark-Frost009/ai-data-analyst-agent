name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ai-data-analyst-agent:ci .

      - name: Start Docker container
        run: docker run --detach --name ai-data-analyst-agent -p 8501:8501 ai-data-analyst-agent:ci

      - name: Wait for container health
        shell: bash
        run: |
          for attempt in {1..30}; do
            health_status="$(docker inspect --format='{{.State.Health.Status}}' ai-data-analyst-agent)"
            echo "Health status: ${health_status}"

            if [ "${health_status}" = "healthy" ]; then
              exit 0
            fi

            if [ "${health_status}" = "unhealthy" ]; then
              docker logs ai-data-analyst-agent
              exit 1
            fi

            sleep 2
          done

          docker logs ai-data-analyst-agent
          exit 1

      - name: Show container logs after failure
        if: failure()
        run: docker logs ai-data-analyst-agent
